[package]
name = "release"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xt-release"
path = "src/bin/xt-release.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
tar = "0.4"
flate2 = "1"
thiserror = "2"
