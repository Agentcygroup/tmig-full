[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
k        = "run -p xt -- kernel"
p        = "run -p xt -- policy-check"
v        = "run -p xt -- verify"
r        = "run -p xt -- release"
verify   = "run --release -p xt -- verify"
ci       = "run --release -p xt -- ci"
fmt-all  = "fmt --all -- --check"
lint-all = "clippy --all-targets --all-features -- -D warnings"
test-all = "test --release --workspace"

[net]
git-fetch-with-cli = true

[term]
color = "auto"
verbose = false
