[graph]
targets = []

[advisories]
version = 2
yanked = "warn"


# fxhash is unmaintained, only transitively via wasmtime -> fxprof.
# No safe upgrade available. Ignored until wasmtime drops fxprof.
ignore = ["RUSTSEC-2025-0057"]
[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
