name: ci
on:
  push:         { branches: [main] }
  pull_request: { branches: [main] }
  schedule:     [ { cron: '0 6 * * *' } ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 1700000000

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: verify rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --release --all-targets

  gate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: derive delta range
        id: range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: rank deltas
        run: |
          mkdir -p gate-out
          python3 gate/merge_gate.py rank \
            --base '${{ steps.range.outputs.base }}' \
            --head '${{ steps.range.outputs.head }}' \
            --output gate-out/delta-ranked.json
      - name: polyglot harness
        env:
          RUST_UPSTREAM_PASS: '1'
        run: bash gate/polyglot_harness.sh gate-out/delta-ranked.json gate-out/harness.json gate-out/ledger.jsonl
      - name: grade current-run ledger
        run: |
          python3 gate/merge_gate.py grade-ledger \
            --ledger gate-out/ledger.jsonl \
            --output gate-out/ledger-grade.json
      - name: land decision
        run: |
          python3 gate/merge_gate.py evaluate \
            --delta gate-out/delta-ranked.json \
            --harness gate-out/harness.json \
            --ledger-grade gate-out/ledger-grade.json \
            --output gate-out/land-decision.json
          grep -q '"decision": "ALLOW_LAND"' gate-out/land-decision.json
      - name: upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-evidence-${{ github.sha }}
          path: gate-out/
          if-no-files-found: error
