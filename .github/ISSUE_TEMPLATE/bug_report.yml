name: Bug report
description: Something is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Minimal reproducer }
    validations: { required: true }
  - type: input
    id: commit
    attributes: { label: Commit / tag }
    validations: { required: true }
