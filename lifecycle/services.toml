[[service]]
name = "llama"
port = 8080
health = "http://127.0.0.1:8080/v1/models"
log = "~/.llama/router.log"
cwd = "~"
cmd = ["/opt/homebrew/bin/llama-server", "--models-dir", "~/.llama/models", "--host", "127.0.0.1", "--port", "8080", "--ctx-size", "32768", "--n-gpu-layers", "999"]

[[service]]
name = "embeddings"
port = 8081
health = "http://127.0.0.1:8081/health"
log = "~/.embeddings.log"
cwd = "~/tmig-full"
cmd = ["$VENV/bin/python", "oss-providers/embeddings_server.py"]

